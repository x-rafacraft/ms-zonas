# SonarQube Configuration
sonar.projectKey=ms-zonas-seguras
sonar.projectName=Microservicio Zonas Seguras
sonar.projectVersion=0.0.1-SNAPSHOT

# Encoding
sonar.sourceEncoding=UTF-8

# Sources and tests
sonar.sources=src/main/java
sonar.tests=src/test/java

# Binary directories
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test

# Coverage report
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

# Exclusions (optional)
sonar.exclusions=**/config/**,**/util/**,**/dto/**,**/schema/**,**/model/**

# Test exclusions
sonar.test.exclusions=**/*Test.java,**/*Tests.java
